schema_version: 1

components:
  # Workloads define the shape of a generated project. A hybrid project uses
  # an uv workspace and combines training with a serving workload.
  - id: library
    name: Python library
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: cli
    name: CLI application
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: api
    name: API service
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: web
    name: Python web application
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: tui
    name: Terminal UI
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: mcp
    name: MCP server
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: agent
    name: AI agent
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: rag
    name: RAG application
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: inference
    name: Model inference service
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: training
    name: Model training project
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"
  - id: hybrid
    name: Training and serving workspace
    layer: workload
    tier: stable
    python: ">=3.11,<3.15"

  # Primary frameworks. Only one primary framework is selected per workload.
  - id: typer
    name: Typer
    layer: framework
    tier: stable
    workloads: [cli]
    python: ">=3.11,<3.15"
    packages: ["typer>=0.27.1,<1"]
  - id: fastapi
    name: FastAPI
    layer: framework
    tier: stable
    workloads: [api]
    python: ">=3.11,<3.15"
    packages: ["fastapi[standard]>=0.141.1,<1", "pydantic>=2.13.4,<3", "uvicorn>=0.52.1,<1"]
  - id: flask
    name: Flask
    layer: framework
    tier: stable
    workloads: [api]
    python: ">=3.11,<3.15"
    packages: ["flask>=3.1.2,<4"]
  - id: fastmcp
