[project]
name = "python-template"
version = "0.5.1"
description = "Generate production-ready Python and AI stacks by combining frameworks, data engines, tooling, and cloud deployment."
readme = "readme.md"
requires-python = ">=3.13"
authors = [
    { name = "Leynier Gutiérrez González", email = "leynier41@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]

# This project is a Copier template, not an installable package.
[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "copier>=9.17.1",
    "pydantic>=2.13.4,<3",
    "python-hcl2>=8.1.2,<9",
    "pyyaml>=6.0.3,<7",
    "pytest>=9.1.1",
    "pytest-copie>=0.3.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
]
docs = [
    "zensical>=0.0.56",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: generates a project and runs its full toolchain (deselect with '-m \"not slow\"')",
    "preset: generates and validates an integration-heavy v0.5 preset on Linux",
]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "RUF"]
ignore = ["E501"]
