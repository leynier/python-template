[project]
name = "python-template"
version = "0.5.0"
description = "Composable Python and AI project template powered by Copier and uv"
readme = "readme.md"
requires-python = ">=3.13"
authors = [
    { name = "Leynier Gutiérrez González", email = "leynier41@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]

# This project is a Copier template, not an installable package.
[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "copier>=9.17.1",
    "pydantic>=2.13.4,<3",
    "python-hcl2>=8.1.2,<9",
    "pyyaml>=6.0.3,<7",
    "pytest>=9.1.1",
    "pytest-copie>=0.3.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: generates a project and runs its full toolchain (deselect with '-m \"not slow\"')",
    "preset: generates and validates an integration-heavy v0.5 preset on Linux",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "RUF"]
ignore = ["E501"]
