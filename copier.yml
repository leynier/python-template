_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja

_exclude:
  - "copier.yml"
  - "_catalog_dependencies"
  - "_catalog_dependencies.jinja"
  # Source texts for the LICENSE file. They are pulled in with {% include %}
  # by the LICENSE template, so they must never be copied on their own.
  - "licenses"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"

_tasks:
  - command: git init --initial-branch=main
    when: "{{ _copier_operation == 'copy' }}"
  - command: uv sync --all-groups
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |
  Your project "{{ project_name }}" is ready.

      cd {{ project_slug }}
      uv run pytest

  {% if publish_to_pypi %}
  Before your first release, configure PyPI Trusted Publishing at
  https://pypi.org/manage/account/publishing/ with:

      owner:     {{ github_username }}
      repository: {{ github_repo }}
      workflow:   publish.yml
      environment: pypi
  {% endif %}

_message_after_update: |
  Template updated to {{ _copier_answers._commit }}.
  Review the diff, then run `uv sync` and `uv run pytest`.

# ---------------------------------------------------------------- identity --

project_name:
  type: str
  help: Human readable name of the project
  default: My Project
  validator: "{% if not project_name.strip() %}Cannot be empty{% endif %}"

project_slug:
  type: str
  help: Directory and distribution name (kebab-case)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not project_slug | regex_search('^[a-z][a-z0-9-]*$') %}
    Must be lowercase, start with a letter, and contain only letters, digits and hyphens
    {% endif %}

module_name:
  type: str
  help: Importable Python package name (snake_case)
  default: "{{ project_slug | lower | replace('-', '_') }}"
  validator: >-
    {% if not module_name | regex_search('^[a-z_][a-z0-9_]*$') %}
    Must be a valid Python identifier: lowercase letters, digits and underscores
    {% endif %}

description:
  type: str
  help: One line description of the project
  default: ""

author_name:
  type: str
  help: Your full name
  default: ""
  validator: "{% if not author_name.strip() %}Cannot be empty{% endif %}"

author_email:
  type: str
  help: Your email address
  default: ""
  validator: >-
    {% if not author_email | regex_search('^[^@\s]+@[^@\s]+\.[^@\s]+$') %}
    Must be a valid email address
    {% endif %}

github_username:
  type: str
  help: GitHub username or organization that will host the repository
  default: ""
  validator: "{% if not github_username.strip() %}Cannot be empty{% endif %}"

github_repo:
  type: str
  help: GitHub repository name
  default: "{{ project_slug }}"

# ------------------------------------------------------------------ shape --

preset:
  type: str
  help: Start from an editable recipe or configure every layer yourself
  default: python-library
  choices:
    Python Library: python-library
    Typer CLI: typer-cli
    FastAPI API: fastapi-api
    FastMCP Tool Server: fastmcp-server
    PydanticAI + Harness + OpenAI: pydantic-ai-openai
    Google ADK + Gemini: google-adk-gemini
    Strands Agents + Bedrock: strands-bedrock
    LangGraph + Anthropic + FastAPI: langgraph-anthropic-api
    LlamaIndex RAG + OpenAI + Pinecone + Gradio: llamaindex-rag
    Lingo + Ollama + Beaver + Violetear: local-lingo-app
    LiteLLM Gateway + Redis + Docker: litellm-gateway
    Hugging Face fine-tuning + MLflow + BentoML: hf-finetuning
    Custom - compose every layer: custom

workload:
  type: str
  help: What is the primary workload?
  default: >-
    {%- if preset == 'typer-cli' -%}cli
    {%- elif preset == 'fastapi-api' -%}api
    {%- elif preset == 'fastmcp-server' -%}mcp
    {%- elif preset in ['pydantic-ai-openai', 'google-adk-gemini', 'strands-bedrock', 'langgraph-anthropic-api', 'local-lingo-app'] -%}agent
    {%- elif preset == 'llamaindex-rag' -%}rag
    {%- elif preset == 'litellm-gateway' -%}inference
    {%- elif preset == 'hf-finetuning' -%}hybrid
    {%- else -%}library{%- endif -%}
  choices:
    Library - importable package: library
    CLI application: cli
    API service: api
    Python web application: web
    Terminal UI: tui
    MCP server: mcp
    AI agent: agent
    RAG application: rag
    Model inference service: inference
    Model training project: training
    Training and serving workspace: hybrid

ai_capabilities:
  type: str
  help: Which AI capability drives this project?
  default: >-
    {%- if workload == 'mcp' -%}mcp
    {%- elif workload == 'agent' -%}agents
    {%- elif workload == 'rag' -%}rag
    {%- elif workload == 'inference' -%}inference
    {%- elif workload in ['training', 'hybrid'] -%}training
    {%- else -%}none{%- endif -%}
  choices:
    None - keep the project simple: none
    MCP tools and resources: mcp
    AI agents: agents
    Retrieval-augmented generation: rag
    Model inference: inference
    Training and fine-tuning: training
  validator: >-
    {% if workload in ['library', 'cli', 'api', 'web', 'tui'] and ai_capabilities != 'none' and preset in ['python-library', 'typer-cli', 'fastapi-api'] %}
    The selected simple preset intentionally has no AI capabilities; choose Custom to add them
    {% endif %}

framework:
  type: str
  help: Primary framework for this workload
  default: >-
    {%- if preset == 'typer-cli' or workload == 'cli' -%}typer
    {%- elif preset == 'fastapi-api' or workload == 'api' -%}fastapi
    {%- elif preset == 'fastmcp-server' or workload == 'mcp' -%}fastmcp
    {%- elif preset == 'pydantic-ai-openai' -%}pydantic-ai
    {%- elif preset == 'google-adk-gemini' -%}google-adk
    {%- elif preset == 'strands-bedrock' -%}strands-agents
    {%- elif preset == 'langgraph-anthropic-api' -%}langgraph
    {%- elif preset == 'llamaindex-rag' -%}llamaindex
    {%- elif preset == 'local-lingo-app' -%}lingo
    {%- elif preset == 'hf-finetuning' -%}transformers
    {%- else -%}none{%- endif -%}
  choices:
    None: none
    Typer: typer
    FastAPI: fastapi
    Flask: flask
    FastMCP: fastmcp
    PydanticAI: pydantic-ai
    LangGraph: langgraph
    LangChain: langchain
    LlamaIndex: llamaindex
    CrewAI: crewai
    Hugging Face smolagents: smolagents
    DSPy: dspy
    OpenAI Agents SDK: openai-agents
    Google ADK: google-adk
    Strands Agents: strands-agents
    Microsoft AutoGen: autogen
    AG2: ag2
    Agno: agno
    Lingo: lingo
    Haystack: haystack
    PyTorch: pytorch
    Hugging Face Transformers: transformers
    JAX: jax
    Keras / TensorFlow: keras
    scikit-learn: scikit-learn
    XGBoost: xgboost
  validator: >-
    {% set allowed = {
      'library': ['none'],
      'cli': ['typer'],
      'api': ['fastapi', 'flask'],
      'web': ['none'],
      'tui': ['none'],
      'mcp': ['fastmcp'],
      'agent': ['pydantic-ai', 'langgraph', 'langchain', 'llamaindex', 'crewai', 'smolagents', 'dspy', 'openai-agents', 'google-adk', 'strands-agents', 'autogen', 'ag2', 'agno', 'lingo'],
      'rag': ['langchain', 'llamaindex', 'haystack'],
      'inference': ['none'],
      'training': ['pytorch', 'transformers', 'jax', 'keras', 'scikit-learn', 'xgboost'],
      'hybrid': ['pytorch', 'transformers', 'jax', 'keras', 'scikit-learn', 'xgboost']
    } %}
    {% if framework not in allowed[workload] %}{{ framework }} is not compatible with the {{ workload }} workload{% endif %}

pydantic_ai_harness:
  type: str
  multiselect: true
  help: Optional PydanticAI Harness capabilities
  default: "{{ ['skills'] if preset == 'pydantic-ai-openai' else [] }}"
  choices:
    Agent skills: skills
    ACP: acp
    Browser use: browser-use
    Code mode: code-mode
    DBOS durable execution: dbos
    Dynamic workflows: dynamic-workflow
    Exa search: exa
    Logfire: logfire
    Modal: modal
    MongoDB: mongodb
    StackOne: stackone
    Temporal: temporal
  when: "{{ framework == 'pydantic-ai' }}"

model_provider:
  type: str
  help: Provider for generative models
  default: >-
    {%- if preset in ['pydantic-ai-openai', 'llamaindex-rag'] -%}openai
    {%- elif preset == 'google-adk-gemini' -%}gemini
    {%- elif preset == 'strands-bedrock' -%}bedrock
    {%- elif preset == 'langgraph-anthropic-api' -%}anthropic
    {%- elif preset == 'local-lingo-app' -%}ollama
    {%- else -%}openai{%- endif -%}
  choices:
    OpenAI: openai
    Anthropic: anthropic
    Google Gemini: gemini
    Azure OpenAI: azure-openai
    AWS Bedrock: bedrock
    OpenRouter: openrouter
    Groq: groq
    Mistral: mistral
    Cohere: cohere
    Hugging Face: huggingface
    Ollama: ollama
    OpenAI-compatible endpoint: openai-compatible
    xAI: xai
    DeepSeek: deepseek
    Together AI: together
    Fireworks AI: fireworks
  when: "{{ ai_capabilities in ['agents', 'rag', 'inference'] }}"

embedding_provider:
  type: str
  help: Provider for embeddings (independent from the generative model)
  default: "{{ 'openai' if preset == 'llamaindex-rag' else 'sentence-transformers' }}"
  choices:
    Local Sentence Transformers: sentence-transformers
    OpenAI: openai
    Google Gemini: gemini
    Cohere: cohere
    Mistral: mistral
    Hugging Face: huggingface
    Ollama: ollama
  when: "{{ ai_capabilities == 'rag' }}"

interfaces:
  type: str
  multiselect: true
  help: User-facing interfaces and additional entrypoints
  default: >-
    {% if preset == 'langgraph-anthropic-api' %}{{ ['fastapi'] }}
    {% elif preset == 'llamaindex-rag' %}{{ ['gradio'] }}
    {% elif preset == 'local-lingo-app' %}{{ ['violetear'] }}
    {% elif workload == 'web' %}{{ ['nicegui'] }}
    {% elif workload == 'tui' %}{{ ['textual'] }}
    {% else %}{{ [] }}{% endif %}
  choices:
    FastAPI: fastapi
    Flask: flask
    Streamlit: streamlit
    Gradio: gradio
    Chainlit: chainlit
    Textual: textual
    NiceGUI: nicegui
    FastHTML: fasthtml
    Violetear: violetear
    JupyterLab: jupyterlab
  when: "{{ workload in ['web', 'tui', 'agent', 'rag', 'training', 'hybrid'] }}"

sql_store:
  type: str
  help: SQL engine
  default: none
  choices:
    None: none
    SQLite: sqlite
    PostgreSQL: postgresql
    MySQL: mysql
    DuckDB: duckdb
    Supabase: supabase

sql_abstraction:
  type: str
  help: SQL abstraction and migration layer
  default: sqlmodel
  choices:
    SQLModel + Alembic: sqlmodel
    SQLAlchemy + Alembic: sqlalchemy
  when: "{{ sql_store not in ['none', 'supabase'] }}"

document_store:
  type: str
  help: Document store
  default: "{{ 'beaver' if preset == 'local-lingo-app' else 'none' }}"
  choices:
    None: none
    MongoDB: mongodb
    Supabase: supabase
    Beaver local bundle: beaver

vector_store:
  type: str
  help: Vector store
  default: >-
    {%- if preset == 'llamaindex-rag' -%}pinecone
    {%- elif preset == 'local-lingo-app' -%}beaver
    {%- else -%}none{%- endif -%}
  choices:
    None: none
    Beaver local bundle: beaver
    pgvector: pgvector
    Qdrant: qdrant
    Chroma: chroma
    LanceDB: lancedb
    Weaviate: weaviate
    Pinecone: pinecone
    Milvus: milvus

graph_store:
  type: str
  help: Graph store
  default: "{{ 'beaver' if preset == 'local-lingo-app' else 'none' }}"
  choices:
    None: none
    Beaver local bundle: beaver
    Neo4j: neo4j

cache_store:
  type: str
  help: Cache and event store
  default: >-
    {%- if preset == 'local-lingo-app' -%}beaver
    {%- elif preset == 'litellm-gateway' -%}redis
    {%- else -%}none{%- endif -%}
  choices:
    None: none
    Beaver local bundle: beaver
    Redis: redis

data_config:
  type: bool
  default: >-
    {{ sql_store != 'none' or document_store != 'none' or vector_store != 'none' or graph_store != 'none' or cache_store != 'none' }}
  when: false

auth:
  type: str
  help: Authentication strategy
  default: none
  choices:
    None: none
    API key: api-key
    Generic OAuth / OIDC: oidc
    Supabase Auth: supabase-auth
  when: "{{ workload in ['api', 'web', 'mcp', 'agent', 'rag', 'inference', 'hybrid'] }}"

# Internal derived switch used in template paths. Keeping this expression out
# of filenames avoids the Windows 260-character checkout limit.
runtime_config:
  type: bool
  default: >-
    {{ ai_capabilities != 'none' or sql_store != 'none' or document_store != 'none' or vector_store != 'none' or graph_store != 'none' or cache_store != 'none' or auth != 'none' }}
  when: false

serving:
  type: str
  help: Model serving engine
  default: >-
    {%- if preset == 'litellm-gateway' -%}litellm
    {%- elif preset == 'hf-finetuning' -%}bentoml
    {%- else -%}none{%- endif -%}
  choices:
    None: none
    BentoML: bentoml
    LiteLLM: litellm
    vLLM: vllm
    Ollama: ollama-serving
    Ray Serve: ray-serve
  when: "{{ workload in ['inference', 'hybrid'] }}"

training_extensions:
  type: str
  multiselect: true
  help: Training and optimization extensions
  default: >-
    {{ ['datasets', 'accelerate', 'peft', 'trl'] if preset == 'hf-finetuning' else [] }}
  choices:
    Lightning: lightning
    Hugging Face Datasets: datasets
    Accelerate: accelerate
    PEFT: peft
    TRL: trl
    Optuna: optuna
  when: "{{ workload in ['training', 'hybrid'] }}"

mlops_tools:
  type: str
  multiselect: true
  help: Data and ML orchestration tools
  default: []
  choices:
    Prefect: prefect
    Dagster: dagster
    Temporal: temporal
    Celery: celery
    DVC: dvc
    Feast: feast
    Evidently: evidently
    Polars: polars
    Pandera: pandera
  when: "{{ workload in ['training', 'hybrid'] }}"

quality_tools:
  type: str
  multiselect: true
  help: Evaluation and observability tools
  default: "{{ ['mlflow'] if preset == 'hf-finetuning' else [] }}"
  choices:
    DeepEval: deepeval
    Ragas: ragas
    Pydantic Evals: pydantic-evals
    OpenTelemetry: opentelemetry
    Langfuse: langfuse
    Phoenix: phoenix
    MLflow: mlflow
    LangSmith: langsmith
    Weights & Biases: wandb
  when: "{{ ai_capabilities != 'none' or workload in ['training', 'hybrid'] }}"

deploy_target:
  type: str
  help: Primary deployment target; Docker remains the portable base for services
  default: "{{ 'docker' if workload not in ['library', 'cli'] else 'none' }}"
  choices:
    None: none
    Docker / Compose: docker
    Render: render
    Fly.io: fly
    Vercel: vercel
    Railway: railway
    Hugging Face Spaces: hf-spaces
    Modal: modal
    RunPod: runpod
    BentoCloud: bentocloud
    AWS ECS: aws-ecs
    AWS SageMaker: aws-sagemaker
    Google Cloud Run: cloud-run
    Vertex AI: vertex-ai
    Azure Container Apps: azure-container-apps
    Azure ML: azure-ml

iac_provider:
  type: str
  help: Infrastructure as code for the primary deployment target
  default: none
  choices:
    None: none
    Pulumi with Python: pulumi
    Terraform: terraform
  when: "{{ deploy_target not in ['none', 'docker', 'vercel', 'hf-spaces'] }}"

python_version:
  type: str
  # 3.10 is deliberately not offered: it reaches end of life on 2026-10-31.
  # Drop each version from this list as it approaches its EOL date, and add
  # new ones once they are released.
  help: Minimum supported Python version
  default: "3.13"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
  validator: >-
    {% if (framework in ['lingo'] or 'violetear' in interfaces or 'beaver' in [document_store, vector_store, graph_store, cache_store]) and python_version == '3.11' %}
    The selected stack requires Python 3.12 or newer
    {% elif (framework == 'crewai' or 'chainlit' in interfaces) and python_version == '3.14' %}
    The selected stack currently requires Python 3.13 or older
    {% endif %}

license:
  type: str
  help: License for the project
  default: MIT
  choices:
    MIT: MIT
    Apache-2.0: Apache-2.0
    BSD-3-Clause: BSD-3-Clause
    GPL-3.0-or-later: GPL-3.0-or-later
    None - proprietary: none

copyright_year:
  type: str
  # Copier has no date global and jinja2-time is not bundled, so adding a
  # dynamic default would mean an extra dependency that breaks plain
  # `uvx copier`. Maintainers: bump this default each January.
  help: Copyright year
  default: "2026"
  when: "{{ license != 'none' }}"
  validator: >-
    {% if not copyright_year | regex_search('^[0-9]{4}$') %}
    Must be a four digit year
    {% endif %}

# --------------------------------------------------------------- features --

use_docs:
  type: bool
  help: Generate a documentation site with Zensical?
  default: true

publish_to_pypi:
  type: bool
  help: Publish to PyPI on tag, using Trusted Publishing (no secrets)?
  default: "{{ workload in ['library', 'cli'] }}"

use_docker:
  type: bool
  help: Include a multi-stage Dockerfile?
  default: "{{ workload not in ['library', 'cli'] }}"

use_devcontainer:
  type: bool
  help: Include a VS Code devcontainer?
  default: false

use_codeql:
  type: bool
  help: Enable GitHub CodeQL security scanning?
  default: true

agent_instructions:
  type: bool
  help: Include AGENTS.md so AI coding agents know the project conventions?
  default: true

# ---------------------------------------------------------------- socials --
# Replaces the 14 mandatory fields of the previous cookiecutter template.
# Each handle is only asked for when its network is selected, and every one
# defaults to your GitHub username.

social_links:
  type: str
  multiselect: true
  help: Which social links should appear in the documentation footer?
  default:
    - github
  choices:
    GitHub: github
    LinkedIn: linkedin
    X (Twitter): x
    Mastodon: mastodon
    Bluesky: bluesky
    Telegram: telegram
    GitLab: gitlab
    Dev.to: devto
    Medium: medium
    Stack Overflow: stackoverflow
    YouTube: youtube
    Instagram: instagram
    Facebook: facebook
    ResearchGate: researchgate
    Email: email
  when: "{{ use_docs }}"

linkedin_handle:
  type: str
  help: LinkedIn handle
  default: "{{ github_username }}"
  when: "{{ use_docs and 'linkedin' in social_links }}"

x_handle:
  type: str
  help: X (Twitter) handle, without the @
  default: "{{ github_username }}"
  when: "{{ use_docs and 'x' in social_links }}"

mastodon_url:
  type: str
  help: Full Mastodon profile URL (instances differ, so no default)
  default: "https://fosstodon.org/@{{ github_username }}"
  when: "{{ use_docs and 'mastodon' in social_links }}"

bluesky_handle:
  type: str
  help: Bluesky handle (e.g. name.bsky.social)
  default: "{{ github_username }}.bsky.social"
  when: "{{ use_docs and 'bluesky' in social_links }}"

telegram_handle:
  type: str
  help: Telegram handle
  default: "{{ github_username }}"
  when: "{{ use_docs and 'telegram' in social_links }}"

gitlab_handle:
  type: str
  help: GitLab handle
  default: "{{ github_username }}"
  when: "{{ use_docs and 'gitlab' in social_links }}"

devto_handle:
  type: str
  help: Dev.to handle
  default: "{{ github_username }}"
  when: "{{ use_docs and 'devto' in social_links }}"

medium_handle:
  type: str
  help: Medium handle, without the @
  default: "{{ github_username }}"
  when: "{{ use_docs and 'medium' in social_links }}"

stackoverflow_id:
  type: str
  help: Stack Overflow user path (e.g. 8921443/leynier)
  default: "{{ github_username }}"
  when: "{{ use_docs and 'stackoverflow' in social_links }}"

youtube_id:
  type: str
  help: YouTube channel ID or @handle
  default: "@{{ github_username }}"
  when: "{{ use_docs and 'youtube' in social_links }}"

instagram_handle:
  type: str
  help: Instagram handle
  default: "{{ github_username }}"
  when: "{{ use_docs and 'instagram' in social_links }}"

facebook_handle:
  type: str
  help: Facebook handle
  default: "{{ github_username }}"
  when: "{{ use_docs and 'facebook' in social_links }}"

researchgate_handle:
  type: str
  help: ResearchGate profile name
  default: "{{ github_username }}"
  when: "{{ use_docs and 'researchgate' in social_links }}"
