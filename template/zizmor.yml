rules:
  unpinned-uses:
    config:
      policies:
        # Actions are pinned to release tags rather than commit SHAs, for
        # readability and quieter Dependabot updates. The trade-off is that a
        # tag can be moved by whoever controls the action, so only pin tags of
        # actions you trust. Change this to `hash-pin` if you would rather
        # require full commit SHAs.
        "*": ref-pin
