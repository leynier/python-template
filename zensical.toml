[project]
site_name = "Python Template"
site_url = "https://python-template.leynier.dev/"
site_description = "Generate production-ready Python and AI stacks by combining frameworks, data engines, tooling, and cloud deployment."
site_author = "Leynier Gutiérrez González"
copyright = "Copyright &copy; 2026 Leynier Gutiérrez González"

repo_url = "https://github.com/leynier/python-template"
repo_name = "leynier/python-template"
edit_uri = "edit/main/docs/"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Quick start" = "getting-started.md" },
    { "Choose a stack" = "guides/choose-a-stack.md" },
  ] },
  { "Concepts" = [
    { "Composable layers" = "concepts/layers.md" },
    { "Support model" = "concepts/support.md" },
  ] },
  { "Guides" = [
    { "Agent skills" = "guides/agent-skills.md" },
    { "Deployment and IaC" = "guides/deployment.md" },
    { "Develop the template" = "guides/development.md" },
  ] },
  { "Reference" = [
    { "Presets" = "reference/presets.md" },
    { "Components" = "reference/components.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/leynier"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
