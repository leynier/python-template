name: Bug report
description: Report something that is not working in the template
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: workload
    attributes:
      label: Which workload did you generate?
      options:
        - library
        - cli
        - api
        - web
        - tui
        - mcp
        - agent
        - rag
        - inference
        - training
        - hybrid
        - repository or documentation
    validations:
      required: true

  - type: textarea
    id: answers
    attributes:
      label: Contents of .copier-answers.yml
      description: From the generated project, with secrets removed. This identifies every selected layer.
      render: yaml

  - type: input
    id: version
    attributes:
      label: Template version or commit
      placeholder: v0.5.0 or a commit SHA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
    validations:
      required: true
